<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reaction Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container text-center mt-5">
    <h1 class="mb-3">🎮 Reaction Game</h1>
    <p class="lead">Click the red box as quickly as you can in 30 seconds!</p>
    <div class="d-flex justify-content-center gap-4 mb-4">
      <button class="btn btn-primary" onclick="startGame()">Start Game</button>
      <h5>⏱ Time Left: <span id="timeLeft">30</span>s</h5>
      <h5>🏆 Score: <span id="score">0</span></h5>
    </div>
    <h4 id="reactionTime" class="text-success mt-3"></h4>
    <h3 id="finalScore" class="text-danger mt-4"></h3>
  </div>
  <div id="gameBox" onclick="boxClicked()"></div>
  <audio id="clickSound" src="{{ url_for('static',mixkit-camera-shutter-click-1133.wav') }}"></audio>
  <audio id="gameOverSound" src="{{ url_for('static',mixkit-long-game-over-notification-276.wav ') }}"></audio>
  <script>
    let startTime;
    let score = 0;
    let timeLeft = 30;
    let gameInterval;
    let boxTimeout;
    const clickSound = document.getElementById("clickSound");
    const gameOverSound = document.getElementById("gameOverSound");
    function getRandomPosition() {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      return { x, y };
    }
    function showBox() {
      const box = document.getElementById("gameBox");
      const { x, y } = getRandomPosition();
      box.style.left = `${x}px`;
      box.style.top = `${y}px`;
      box.style.display = "block";
      startTime = new Date().getTime();
    }
    function startGame() {
      score = 0;
      timeLeft = 30;
      document.getElementById("score").textContent = score;
      document.getElementById("timeLeft").textContent = timeLeft;
      document.getElementById("reactionTime").textContent = "";
      document.getElementById("finalScore").textContent = "";
      document.getElementById("gameBox").style.display = "none";
      gameInterval = setInterval(() => {
        timeLeft--;
        document.getElementById("timeLeft").textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(gameInterval);
          clearTimeout(boxTimeout);
          document.getElementById("gameBox").style.display = "none";
          document.getElementById("finalScore").textContent = `Game Over! Your final score is: ${score}`;
          gameOverSound.play();
        }
      }, 1000);
      nextBox();
    }
    function nextBox() {
      const delay = Math.random() * 1500 + 500;
      boxTimeout = setTimeout(() => {
        if (timeLeft > 0) showBox();
      }, delay);
    }
    function boxClicked() {
      const clickTime = new Date().getTime();
      const reaction = clickTime - startTime;
      document.getElementById("reactionTime").textContent = `Reaction time: ${reaction} ms`;
      score++;
      document.getElementById("score").textContent = score;
      document.getElementById("gameBox").style.display = "none";
      clickSound.play();
      nextBox();
    }
  </script>
</body>
</html>
